<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LootRadar — PC Game Deal Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1>LOOT<span>RADAR</span></h1>
        <p class="tagline">Live PC game discounts across Steam, GOG, and Epic Games.</p>
      </div>
      <div class="tabs">
        <button class="tab active" id="allTab">Live Deals</button>
        <button class="tab" id="favTab">Wishlist (0)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="field search-field">
        <label for="searchInput">Search Title</label>
        <input type="text" id="searchInput" placeholder="e.g. Witcher, Cyberpunk, Batman..." />
      </div>

      <div class="field">
        <label for="priceSelect">Max Price</label>
        <select id="priceSelect">
          <option value="all">Any price</option>
          <option value="5">Under $5</option>
          <option value="10">Under $10</option>
          <option value="20">Under $20</option>
        </select>
      </div>

      <div class="field">
        <label for="sortSelect">Sort By</label>
        <select id="sortSelect">
          <option value="savings-desc">Biggest Discount (%)</option>
          <option value="price-asc">Price (Low to High)</option>
          <option value="price-desc">Price (High to Low)</option>
          <option value="rating-desc">Best Steam Rating</option>
        </select>
      </div>
    </div>

    <p class="summary" id="resultSummary"></p>

    <div id="statusBox" class="status"></div>

    <div id="dealsGrid" class="grid"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="close-btn" id="closeModalBtn">Close</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
